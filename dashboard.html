<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Copias y Máquinas Virtuales — Azure</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --card2:#0f1c30; --text:#e2e8f0; --muted:#94a3b8;
    --ok:#22c55e; --alarm:#ef4444; --warn:#f59e0b; --off:#64748b; --accent:#38bdf8;
    --nobkp:#a78bfa; --linea:#334155;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; padding:18px 22px}
  header{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:16px}
  h1{font-size:1.3rem; font-weight:600; text-transform:uppercase; letter-spacing:.03em}
  h1 span{color:var(--accent)}
  #clock{font-size:1.05rem; color:var(--muted); font-variant-numeric:tabular-nums}
  .btn{background:var(--card); color:var(--text); border:1px solid var(--linea); border-radius:8px;
       padding:7px 13px; font-size:.85rem; cursor:pointer; text-transform:uppercase; letter-spacing:.02em}
  .btn:hover{border-color:var(--accent)}
  #banner{display:none; background:#3a2b12; border:1px solid var(--warn); border-radius:10px;
          padding:12px 16px; margin-bottom:14px; font-size:.85rem}
  #banner.show{display:block}
  #banner.bad{background:#3b1f2b; border-color:var(--alarm)}
  #banner ul{margin:6px 0 0 18px}

  /* ---------- resumen: franja centrada con separadores ---------- */
  #kpis{display:flex; justify-content:center; align-items:stretch; flex-wrap:wrap; margin:4px 0 18px}
  .kpi{padding:0 26px; text-align:center}
  .kpi .n{font-size:1.9rem; font-weight:700; line-height:1.1; font-variant-numeric:tabular-nums}
  .kpi .l{font-size:.63rem; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; margin-top:3px}
  .kpi.ok .n{color:var(--ok)} .kpi.warn .n{color:var(--warn)}
  .kpi.alarm .n{color:var(--alarm)} .kpi.nobkp .n{color:var(--nobkp)}
  .sep{width:1px; background:var(--linea); margin:2px 0}

  .pill{border-radius:99px; padding:3px 12px; font-weight:600; text-transform:uppercase;
        letter-spacing:.02em; font-size:.78rem}
  .pill.ok{background:rgba(34,197,94,.15); color:var(--ok)}
  .pill.alarm{background:rgba(239,68,68,.2); color:var(--alarm)}
  .pill.warn{background:rgba(245,158,11,.18); color:var(--warn)}
  .pill.off{background:rgba(100,116,139,.2); color:var(--off)}
  .pill.nobkp{background:rgba(167,139,250,.18); color:var(--nobkp)}

  /* ---------- filtros ---------- */
  .tools{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px}
  input[type=search],select{background:var(--card); color:var(--text); border:1px solid var(--linea);
        border-radius:8px; padding:7px 11px; font-size:.85rem; font-family:inherit}
  input[type=search]{min-width:230px}
  .count{font-size:.75rem; color:var(--muted)}

  /* ---------- grupos ---------- */
  #grupos{display:flex; flex-direction:column; gap:14px}
  .grupo{border-radius:16px; padding:14px 16px 12px;
         background:linear-gradient(180deg, color-mix(in srgb, var(--gc) 10%, var(--bg)), var(--bg) 70%);
         border:1px solid color-mix(in srgb, var(--gc) 35%, transparent);
         border-top:4px solid var(--gc)}
  .grupo-h{display:flex; align-items:center; justify-content:space-between;
           flex-wrap:wrap; gap:8px; margin-bottom:12px}
  .grupo-name{display:flex; align-items:center; gap:10px; font-size:1.15rem; font-weight:700;
              letter-spacing:.04em; text-transform:uppercase; color:var(--gc)}
  .grupo-name .swatch{width:14px; height:14px; border-radius:4px; background:var(--gc)}
  .grupo-sum{display:flex; gap:8px; flex-wrap:wrap}

  /* ---------- tarjetas compactas ---------- */
  .cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(196px,1fr)); gap:8px}
  .card{background:var(--card); border-radius:10px; padding:8px 10px; border-left:4px solid var(--off);
        display:flex; flex-direction:column; gap:3px; min-width:0}
  .card.ok{border-left-color:var(--ok)}
  .card.warn{border-left-color:var(--warn)}
  .card.fail{border-left-color:var(--alarm); animation:blink 1.2s infinite}
  .card.sincopia{border-left-color:var(--nobkp)}
  .card.exento{border-left-color:var(--off); opacity:.6}
  @keyframes blink{50%{background:#3b1f2b}}

  .card-h{display:flex; justify-content:space-between; align-items:center; gap:6px}
  .card-h h2{font-size:.83rem; font-weight:700; line-height:1.25; overflow-wrap:anywhere}
  .status{font-size:.88rem; line-height:1; white-space:nowrap}
  .status.ok{color:var(--ok)} .status.warn{color:var(--warn)} .status.fail{color:var(--alarm)}
  .status.sincopia{color:var(--nobkp)} .status.exento,.status.unknown{color:var(--off)}

  .linea{font-size:.74rem; line-height:1.3; overflow-wrap:anywhere}
  .linea .estado{font-weight:700}
  .linea .cuando{color:var(--muted); font-variant-numeric:tabular-nums}
  .v-ok{color:var(--ok)} .v-warn{color:var(--warn)} .v-alarm{color:var(--alarm)} .v-nobkp{color:var(--nobkp)}
  .sub{font-size:.68rem; color:var(--muted); line-height:1.35; overflow-wrap:anywhere}
  .aviso{color:var(--warn); font-size:.68rem; font-weight:600}

  .tags{display:flex; flex-wrap:wrap; gap:4px; margin-top:1px}
  .tag{font-size:.59rem; padding:1px 7px; border-radius:99px; background:var(--card2);
       border:1px solid var(--linea); color:var(--muted); white-space:nowrap}
  .tag.on{color:var(--ok); border-color:rgba(34,197,94,.45)}
  .tag.az{color:var(--accent); border-color:rgba(56,189,248,.35)}

  /* ---------- grafico y tabla ---------- */
  h3{font-size:.8rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);
     margin:26px 0 10px; font-weight:600}
  .panel{background:var(--card); border-radius:12px; padding:14px 16px}
  .chartwrap{position:relative; height:210px}
  .tablebox{background:var(--card); border-radius:12px; overflow:auto; max-height:460px}
  table{border-collapse:collapse; width:100%; font-size:.8rem}
  th{position:sticky; top:0; background:var(--card2); text-align:left; padding:10px 12px; cursor:pointer;
     font-size:.66rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted);
     border-bottom:1px solid var(--linea); white-space:nowrap}
  td{padding:9px 12px; border-bottom:1px solid #1f2b3d; vertical-align:top}
  tr:last-child td{border-bottom:none}
  .errtxt{color:var(--alarm); font-size:.72rem; margin-top:3px; max-width:430px}
  .empty{padding:26px; text-align:center; color:var(--muted)}
  footer{color:var(--muted); font-size:.7rem; margin-top:26px; text-align:center}

  /* ---------- cartel de sin conexion ---------- */
  #offline-overlay{position:fixed; inset:0; z-index:9999; display:none;
    flex-direction:column; align-items:center; justify-content:center; text-align:center;
    background:rgba(8,12,24,.96)}
  #offline-overlay.show{display:flex}
  .ov-inner{animation:ovpulse 1.5s ease-in-out infinite}
  .ov-icon{font-size:clamp(4rem,13vh,11rem); line-height:1; color:var(--alarm)}
  .ov-title{font-size:clamp(2.4rem,9vw,8rem); font-weight:900; color:var(--alarm);
    letter-spacing:.06em; margin:.1em 0 .05em}
  .ov-sub{font-size:clamp(1rem,2.6vw,2.2rem); color:var(--muted); margin-bottom:.5em}
  .ov-timer{font-size:clamp(2.2rem,7vw,6rem); font-weight:800; color:#e2e8f0;
    font-variant-numeric:tabular-nums; letter-spacing:.04em}
  @keyframes ovpulse{50%{opacity:.5}}
</style>
</head>
<body>
<header>
  <div style="display:flex; align-items:center; gap:14px">
    <img id="logo" src="/logo" alt="" style="height:42px; display:none; background:#fff; border-radius:8px; padding:3px 8px"
         onload="this.style.display='block'">
    <h1>Copias y máquinas virtuales — <span>Azure</span></h1>
  </div>
  <button class="btn" onclick="cargar(true)">⟳ Actualizar</button>
  <div id="clock">--:--:--</div>
</header>

<div id="banner"></div>
<div id="kpis"></div>

<div class="tools">
  <input type="search" id="q" placeholder="Filtrar por nombre, grupo de recursos o IP…">
  <select id="f">
    <option value="">Todas</option>
    <option value="problema">Con incidencia</option>
    <option value="sincopia">Sin copia de seguridad</option>
    <option value="ok">Correctas</option>
    <option value="exento">Exentas</option>
  </select>
  <span class="count" id="count"></span>
</div>

<div id="grupos"></div>

<h3>Jobs de copia por día</h3>
<div class="panel"><div class="chartwrap"><canvas id="chart"></canvas></div></div>

<h3>Histórico de jobs</h3>
<div>
  <div class="tools">
    <input type="search" id="qj" placeholder="Filtrar por máquina u operación…">
    <select id="fj">
      <option value="">Todos los estados</option>
      <option value="fail">Solo fallidos</option>
      <option value="ok">Solo correctos</option>
    </select>
    <span class="count" id="jcount"></span>
  </div>
  <div class="tablebox">
    <table id="jobs">
      <thead><tr>
        <th data-k="name">Máquina</th><th data-k="operation">Operación</th>
        <th data-k="status">Estado</th><th data-k="type">Tipo</th>
        <th data-k="start_time">Inicio</th><th data-k="duration_s">Duración</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<footer id="foot"></footer>

<div id="offline-overlay">
  <div class="ov-inner">
    <div class="ov-icon">⚠</div>
    <div class="ov-title">SIN CONEXIÓN</div>
    <div class="ov-sub">No se recibe respuesta del servidor</div>
    <div class="ov-timer" id="ov-timer">00:00:00</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
const REFRESH_S = 60;          // sondeo del endpoint
const STALE_MIN = 90;          // aviso si el colector lleva mas de esto sin correr

let DATA = null;
let lastOk = Date.now();
let chart = null;
let sortKey = "start_time", sortDir = -1;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ICONO = {ok:"●", warn:"▲", fail:"✖", sincopia:"◆", exento:"—", unknown:"?"};

const fmt = ts => { if(!ts) return "—";
  const d = new Date(ts); if(isNaN(d)) return "—";
  return d.toLocaleString("es-ES",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"}); };
const ago = ts => { if(!ts) return "";
  const h = (Date.now() - new Date(ts)) / 36e5; if(isNaN(h)) return "";
  return h < 1 ? "hace " + Math.round(h*60) + " min" : h < 48 ? "hace " + Math.round(h) + " h"
       : "hace " + Math.round(h/24) + " días"; };
const dur = s => s == null ? "—" : s < 60 ? Math.round(s)+" s"
      : s < 3600 ? Math.round(s/60)+" min" : (s/3600).toFixed(1)+" h";
const jobState = s => { s = (s||"").toLowerCase();
  if(s.includes("fail") || s.includes("error")) return "fail";
  if(s.includes("progress")) return "warn";
  if(s.includes("complet") || s.includes("success")) return "ok";
  return "unknown"; };
const tipo = t => String(t).replace("AzureIaasVM","VM Azure").replace("AzureStorage","Azure Files");

/* ---------- cartel de sin conexion ---------- */
function updateOverlay(){
  const secs = Math.floor((Date.now() - lastOk) / 1000);
  const caido = secs > REFRESH_S * 3;
  $("offline-overlay").classList.toggle("show", caido);
  const h = String(Math.floor(secs/3600)).padStart(2,"0");
  const m = String(Math.floor(secs%3600/60)).padStart(2,"0");
  const s = String(secs%60).padStart(2,"0");
  $("ov-timer").textContent = `${h}:${m}:${s}`;
}

/* ---------- carga ---------- */
async function cargar(manual){
  try{
    const r = await fetch("/api/data?t=" + Date.now(), {cache:"no-store"});
    if(!r.ok) throw new Error("HTTP " + r.status);
    DATA = await r.json();
    lastOk = Date.now();
    $("offline-overlay").classList.remove("show");
    pintar();
  }catch(e){
    if(manual) alert("No se pudo contactar con el servidor: " + e.message);
  }
  updateOverlay();
}

/* ---------- pintado ---------- */
function pintar(){
  const d = DATA; if(!d) return;

  // --- avisos ---
  const edadMin = (Date.now() - new Date(d.generated_at)) / 60000;
  let bannerHtml = "", bannerClass = "";
  const fallos = (d.items||[]).filter(i => i.state === "fail");
  const sin = (d.items||[]).filter(i => i.state === "sincopia");

  if(d.demo) bannerHtml += "<b>Modo demo.</b> Datos de ejemplo, no reflejan el entorno real.<br>";
  if(edadMin > STALE_MIN){
    bannerClass = "bad";
    bannerHtml += `<b>Datos obsoletos.</b> La última recogida fue ${ago(d.generated_at)}. Revisa el timer del colector.<br>`;
  }
  if(fallos.length){ bannerClass = "bad";
    bannerHtml += "<b>Copias con fallo (" + fallos.length + "):</b> " +
      fallos.map(i => esc(i.name)).join(", ") + "<br>"; }
  if(sin.length) bannerHtml += "<b>Máquinas sin copia de seguridad (" + sin.length + "):</b> " +
      sin.map(i => esc(i.name)).join(", ") + "<br>";
  if((d.collector_errors||[]).length){ bannerClass = "bad";
    bannerHtml += "<b>Errores del colector:</b><ul>" +
      d.collector_errors.map(e => "<li>" + esc(e) + "</li>").join("") + "</ul>"; }

  $("banner").className = bannerHtml ? "show " + bannerClass : "";
  $("banner").innerHTML = bannerHtml;

  // --- resumen ---
  const c = d.counts || {};
  const bloques = [
    ["", d.total_vms||0, "VMs"],
    ["", d.vms_encendidas||0, "Encendidas"],
    ["ok", d.vms_protegidas||0, "Con copia"],
    ["nobkp", c.sincopia||0, "Sin copia"],
    ["warn", c.warn||0, "Atención"],
    ["alarm", c.fail||0, "Fallos"],
    ["alarm", d.failed_jobs||0, "Jobs fallidos"]
  ];
  $("kpis").innerHTML = bloques
    .map(([k,n,l]) => `<div class="kpi ${k}"><div class="n">${n}</div><div class="l">${l}</div></div>`)
    .join('<div class="sep"></div>');

  pintarCards();
  pintarChart();
  pintarJobs();

  const extras = [];
  if(d.huerfanos) extras.push(d.huerfanos + " copia(s) de VMs eliminadas, ocultas");
  $("foot").textContent = "Recogida " + fmt(d.generated_at) + " (" + ago(d.generated_at) + ")" +
    " · aviso si se superan " + d.sla_hours + " h sin copia correcta" +
    (extras.length ? " · " + extras.join(" · ") : "");
}

function politicaTexto(p){
  if(!p || !Object.keys(p).length) return "";
  const partes = [];
  if(p.frecuencia) partes.push(p.frecuencia.toLowerCase());
  if(p.hora) partes.push(p.hora);
  if(p.retencion) partes.push("ret. " + p.retencion);
  return partes.join(" · ");
}

function tarjeta(i){
  const vclass = {ok:"v-ok", warn:"v-warn", fail:"v-alarm", sincopia:"v-nobkp"}[i.state] || "";
  const encendida = i.power_state === "running";
  const agenteMal = i.agente_estado && !/ready/i.test(i.agente_estado);
  const pol = politicaTexto(i.politica_detalle);

  const linea = i.protected
    ? `<span class="estado ${vclass}">${esc(i.last_backup_status || "—")}</span>
       <span class="cuando">${i.last_backup_time ? "· " + ago(i.last_backup_time) : ""}</span>`
    : `<span class="estado ${vclass}">${i.state === "exento" ? "Exenta de copia" : "Sin copia"}</span>`;

  const etiquetas = Object.entries(i.tags || {}).slice(0, 2)
    .map(([k, v]) => `<span class="tag az">${esc(k)}: ${esc(v)}</span>`).join("");

  return `<div class="card ${i.state}" title="${esc(i.name)}${pol ? " — " + esc(pol) : ""}">
    <div class="card-h">
      <h2>${esc(i.name)}</h2>
      <span class="status ${i.state}">${ICONO[i.state] || ""}</span>
    </div>
    <div class="linea">${linea}</div>
    ${agenteMal ? `<div class="aviso">Agente VM: ${esc(i.agente_estado)}</div>` : ""}
    ${i.protection_state && i.protection_state !== "Protected"
      ? `<div class="aviso">Protección: ${esc(i.protection_state)}</div>` : ""}
    <div class="sub">
      ${esc(i.resource_group)}${i.ip ? " · " + esc(i.ip) : ""}
      ${pol ? `<br>${esc(pol)}` : ""}
      ${i.ultima_duracion_s != null ? ` · ${dur(i.ultima_duracion_s)}` : ""}
    </div>
    <div class="tags">
      ${i.kind === "vm" ? `<span class="tag ${encendida ? "on" : ""}">${esc(i.power_state || "estado?")}</span>` : ""}
      ${i.size ? `<span class="tag">${esc(i.size)}</span>` : ""}
      ${i.os ? `<span class="tag">${esc(i.os)}</span>` : ""}
      ${i.kind === "share" ? `<span class="tag">${esc(tipo(i.type))}</span>` : ""}
      ${etiquetas}
    </div>
  </div>`;
}

function bloqueGrupo(nombre, color, miembros){
  const c = {};
  miembros.forEach(i => c[i.state] = (c[i.state] || 0) + 1);
  const pills = [
    c.fail     ? `<span class="pill alarm">✖ ${c.fail} con fallo</span>` : "",
    c.sincopia ? `<span class="pill nobkp">◆ ${c.sincopia} sin copia</span>` : "",
    c.warn     ? `<span class="pill warn">▲ ${c.warn} atención</span>` : "",
    c.ok       ? `<span class="pill ok">● ${c.ok} correctas</span>` : "",
    c.exento   ? `<span class="pill off">— ${c.exento} exentas</span>` : ""
  ].join("");
  return `<div class="grupo" style="--gc:${esc(color)}">
    <div class="grupo-h">
      <div class="grupo-name"><span class="swatch"></span>${esc(nombre)}</div>
      <div class="grupo-sum">${pills}</div>
    </div>
    <div class="cards">${miembros.map(tarjeta).join("")}</div>
  </div>`;
}

function pintarCards(){
  const d = DATA;
  const term = $("q").value.toLowerCase(), filtro = $("f").value;
  const visibles = (d.items||[]).filter(i => {
    if(term && !((i.name + " " + i.resource_group + " " + (i.ip||"")).toLowerCase().includes(term))) return false;
    if(filtro === "problema") return ["fail","warn","sincopia"].includes(i.state);
    if(filtro) return i.state === filtro;
    return true;
  });
  $("count").textContent = visibles.length + " de " + (d.items||[]).length;

  const definidos = (d.grupos||[]).map(g => g.nombre);
  let html = (d.grupos||[]).map(g => {
    const miembros = visibles.filter(i => i.grupo === g.nombre);
    return miembros.length ? bloqueGrupo(g.nombre, g.color, miembros) : "";
  }).join("");

  const huerfanas = visibles.filter(i => !definidos.includes(i.grupo));
  if(huerfanas.length) html += bloqueGrupo("Sin clasificar", "#f59e0b", huerfanas);

  $("grupos").innerHTML = html || '<div class="empty">Sin resultados.</div>';
}

function pintarChart(){
  const d = DATA;
  const byDay = {};
  (d.jobs||[]).forEach(j => {
    if(!j.start_time) return;
    const k = new Date(j.start_time).toISOString().slice(0,10);
    byDay[k] = byDay[k] || {ok:0, fail:0};
    byDay[k][jobState(j.status) === "fail" ? "fail" : "ok"]++;
  });
  const days = Object.keys(byDay).sort();
  if(!window.Chart || !days.length) return;
  const cfg = {
    labels: days.map(k => k.slice(8) + "/" + k.slice(5,7)),
    datasets:[
      {label:"Correctos", data: days.map(k=>byDay[k].ok), backgroundColor:"#22c55e", borderRadius:4},
      {label:"Fallidos",  data: days.map(k=>byDay[k].fail), backgroundColor:"#ef4444", borderRadius:4}
    ]};
  if(chart){ chart.data = cfg; chart.update(); return; }
  chart = new Chart($("chart"), {type:"bar", data:cfg,
    options:{maintainAspectRatio:false, responsive:true,
      scales:{x:{stacked:true, grid:{display:false}, ticks:{color:"#94a3b8"}},
              y:{stacked:true, beginAtZero:true, ticks:{precision:0, color:"#94a3b8"},
                 grid:{color:"#1f2b3d"}}},
      plugins:{legend:{labels:{color:"#94a3b8", boxWidth:12}}}}});
}

function pintarJobs(){
  const d = DATA;
  const term = $("qj").value.toLowerCase(), only = $("fj").value;
  let rows = (d.jobs||[]).filter(j =>
    (!term || (j.name + " " + j.operation + " " + j.status).toLowerCase().includes(term)) &&
    (!only || jobState(j.status) === only));
  rows = rows.slice().sort((a,b) => {
    const x = a[sortKey] ?? "", y = b[sortKey] ?? "";
    return (x > y ? 1 : x < y ? -1 : 0) * sortDir;
  });
  $("jcount").textContent = rows.length + " de " + (d.jobs||[]).length + " jobs";
  document.querySelector("#jobs tbody").innerHTML = rows.length ? rows.map(j => {
    const st = jobState(j.status);
    return `<tr>
      <td>${esc(j.name)}</td><td>${esc(j.operation)}</td>
      <td><span class="pill ${st === "fail" ? "alarm" : st}">${esc(j.status)}</span>
          ${(j.errors||[]).length ? `<div class="errtxt">${esc(j.errors.join(" · "))}</div>` : ""}</td>
      <td>${esc(tipo(j.type))}</td><td>${fmt(j.start_time)}</td><td>${dur(j.duration_s)}</td>
    </tr>`; }).join("") : '<tr><td colspan="6" class="empty">Sin resultados.</td></tr>';
}

/* ---------- arranque ---------- */
document.querySelectorAll("#jobs th").forEach(th => th.onclick = () => {
  const k = th.dataset.k;
  sortDir = (k === sortKey) ? -sortDir : -1;
  sortKey = k; pintarJobs();
});
$("q").oninput = pintarCards; $("f").onchange = pintarCards;
$("qj").oninput = pintarJobs; $("fj").onchange = pintarJobs;

setInterval(() => { $("clock").textContent = new Date().toLocaleTimeString("es-ES"); }, 1000);
setInterval(updateOverlay, 1000);
setInterval(cargar, REFRESH_S * 1000);

cargar();
</script>
</body>
</html>
