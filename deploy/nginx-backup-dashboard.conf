# /etc/nginx/sites-available/backup-dashboard
# ln -s /etc/nginx/sites-available/backup-dashboard /etc/nginx/sites-enabled/
#
# Dashboard interno. Ajusta server_name y restringe el acceso a tu red.

server {
    listen 80;
    server_name backups.interno.serviplana.es;

    root /var/www/backup-dashboard;
    index index.html;

    # --- Restringe a la red interna ---------------------------------------
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny  all;

    # --- Autenticación básica (opcional pero recomendable) ----------------
    # sudo apt install apache2-utils
    # sudo htpasswd -c /etc/nginx/.htpasswd informatica
    # auth_basic "Estado de copias";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store, must-revalidate";
    }

    # data.json queda disponible por si quieres consumirlo desde otro sistema
    location = /data.json {
        add_header Cache-Control "no-store";
    }

    access_log /var/log/nginx/backup-dashboard.access.log;
    error_log  /var/log/nginx/backup-dashboard.error.log;
}
